<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Interactive 3D Physics Models</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#090d14;color:#fff}
#app{display:flex;width:100%;height:100%}
#menu{width:290px;min-width:290px;background:#111827;border-right:1px solid #334155;padding:22px;display:flex;flex-direction:column;gap:10px}
h1{font-size:20px;margin:0 0 5px}
.sub{font-size:12px;color:#94a3b8;line-height:1.45;margin-bottom:10px}
.modelBtn{border:1px solid #334155;background:#1e293b;color:#e2e8f0;padding:13px 12px;border-radius:9px;text-align:left;cursor:pointer;font-size:14px}
.modelBtn:hover{background:#273449}
.modelBtn.active{background:#334155;border-color:#60a5fa;color:#fff}
#viewer{flex:1;position:relative;background:#000}
iframe{border:0;width:100%;height:100%;display:block;background:#000}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05070b;color:#cbd5e1;font-size:15px;z-index:5}
.hidden{display:none!important}
#error{position:absolute;left:20px;right:20px;top:20px;background:#3f1515;border:1px solid #ef4444;border-radius:8px;padding:14px;z-index:10;display:none}
@media(max-width:700px){
 #app{flex-direction:column}
 #menu{width:100%;min-width:0;height:auto;padding:10px;flex-direction:row;flex-wrap:wrap}
 h1,.sub{display:none}.modelBtn{flex:1;min-width:140px}
 #viewer{min-height:0;flex:1}
}
</style>
</head>
<body>
<div id="app">

    <h1>3D Physics Models</h1>
    <div class="sub">Select a model to load its complete interactive simulation.</div>

  </aside>
  <main id="viewer">
    <div id="loading">Loading simulation…</div>
    <div id="error"></div>
    <iframe id="sim" title="3D Physics Simulation" allow="fullscreen"></iframe>
  </main>
</div>

const frame = document.getElementById('sim');
const loading = document.getElementById('loading');
const error = document.getElementById('error');
const buttons = [...document.querySelectorAll('.modelBtn')];

function loadModel(i){
  buttons.forEach((b,n)=>b.classList.toggle('active',n===i));
  loading.classList.remove('hidden');
  error.style.display='none';
  frame.src='about:blank';
  setTimeout(()=>{
    try{
      const decoded = atob(models[i]);
      frame.srcdoc = decoded;
    }catch(e){
      loading.classList.add('hidden');
      error.textContent='Could not load this simulation: '+e.message;
      error.style.display='block';
    }
  },20);
}
frame.addEventListener('load',()=>loading.classList.add('hidden'));
buttons.forEach((b,i)=>b.addEventListener('click',()=>loadModel(i)));
loadModel(0);
</script>
